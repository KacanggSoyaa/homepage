<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danis Nazri Portfolio</title>
    <meta name="description" content="Portfolio of Danis Nazri, software and app developer based in Kuala Lumpur." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2312141C'/%3E%3Ctext x='50' y='64' font-size='42' font-family='monospace' fill='%23E8A33D' text-anchor='middle'%3E%3C/%3E%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // GitHub Pages SPA redirect, decoding half. public/404.html sends an
      // unknown path here as /?/<percent-encoded path>; this puts it back.
      (function (l) {
        // Only the root, and only the exact marker 404.html writes.
        //
        // The guard used to be `l.search[1] === '/'`, which tests the *second
        // character of the raw query string* — so it matched any URL whose query
        // began with `?/`, including a real page like /music/?/... On a refresh
        // of an actual route that ran the decoder against a live URL and
        // rewrote the pathname out from under the visitor. Pinning this to
        // pathname === '/' means the decoder can only ever touch the redirect
        // landing, which is the one place 404.html sends us.
        if (l.pathname !== '/' || l.search.slice(0, 2) !== '?/') return

        // Positional decode, once. The old version ran
        // `search.slice(1).split('&').map(decode).join('?')`, which did two
        // unrelated corruptions at once: it decoded `~and~` back into a raw
        // `&` (a character the very next 404 bounce would re-escape, so each
        // refresh grew the URL), and it rewrote `&` separators into `?`
        // separators, mangling any multi-parameter query.
        var parts = l.search.slice(2).split('&')
        var path = decodeURIComponent(parts[0] || '')
        var query = parts[1] ? '?' + decodeURIComponent(parts[1]) : ''

        // replaceState, not a navigation: index.html is already running, and
        // dropping the `?/` marker in the same step is what makes a refresh a
        // clean no-op instead of another trip through the decoder.
        window.history.replaceState(null, '', '/' + path + query + l.hash)
      }(window.location))
    </script>
  </body>
</html>
